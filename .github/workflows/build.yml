name: SonarQube + Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build_and_scan:
    name: Build, Analyze and Check Quality Gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: carlog
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{runner.os}}-sonar
          restore-keys: ${{runner.os}}-sonar

      - name: Build and analyze
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/carlog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: rootpassword
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        working-directory: backend
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
          -Dsonar.projectKey=JaviRSDEV_CarLog 
          -Dsonar.organization=javirsdev 
          -Dsonar.host.url=https://sonarcloud.io 
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Wait for Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        continue-on-error: true
        timeout-minutes: 5
        with:
          scanMetadataReportFile: backend/target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy to Production (Self-hosted)
    needs: build_and_scan
    runs-on: self-hosted
    steps:
      - name: Deploy to Local Server
        run: |
          cd ~/CarLog/backend
          
          # Levantar los servicios con Docker Compose v2
          docker compose pull
          docker compose up -d --build

      - name: Verificar arranque de Spring Boot
        run: |
            echo "Esperando 20 segundos para asegurar el arranque completo..."
            sleep 20
            
            echo "=== ÚLTIMOS LOGS DEL BACKEND EN PRODUCCIÓN ==="
            LOGS=$(docker logs carlog-backend --tail 200)
            echo "$LOGS"
            
            echo "=== COMPROBANDO VALIDACIÓN REAL ==="
            STATUS=$(docker inspect -f '{{.State.Status}}' carlog-backend)
            
            # 1. Check de Docker (por si ha muerto el contenedor)
            if [ "$STATUS" != "running" ]; then
              echo "ERROR: El contenedor ni siquiera está corriendo. Estado: $STATUS"
              exit 1
            fi
            
            # 2. Check de Spring Boot (busca el mensaje de éxito en los logs)
            if ! echo "$LOGS" | grep -q "Started BackendApplication"; then
              echo "ERROR: El contenedor dice 'running' pero Spring Boot ha petado internamente."
              echo "No se ha encontrado el mensaje de inicio 'Started BackendApplication'."
              exit 1
            fi
            
            echo "¡Despliegue exitoso! El backend ha iniciado el contexto sin errores."